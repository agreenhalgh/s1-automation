# Test configuration.
#
# require-cis2=false is what lets a test start the application at all. ApplicationConfig refuses
# that combination anywhere it could reach live data, which is the point: the only way to run
# without a national identity provider is a configuration that also has no PDS to talk to.
systmone.pds-review.auth.require-cis2=false
systmone.pds-review.intake.token=test-token

# No national APIs and no gateway in a test. Left blank rather than pointed at a stub, so a test
# that accidentally depends on one fails as an explicit error instead of hanging on a socket.
systmone.pds-review.pds.base-url=
systmone.pds-review.ods.base-url=
systmone.pds-review.post-back.url=

spring.datasource.url=jdbc:h2:mem:pdsreview;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# The sweeper and the dispatcher would otherwise fire during short tests and add noise.
systmone.pds-review.review.lock-sweep-interval=1h
systmone.pds-review.post-back.retry-interval=1h

logging.level.org.hibernate.SQL=warn
