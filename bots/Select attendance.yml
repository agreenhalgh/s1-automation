info:
  name: Select attendance
  type: http
  seq: 4

http:
  method: POST
  url: http://localhost:8080/api/bots
  headers:
    - name: X-Worker-Token
      value: changeit
  body:
    type: json
    data: |-
      {
        "botId": "attend",
        "name": "Attend Patient",
        "version": 1,
        "s1Version": "DEMO",
        "globalTimeoutMs": 60000,
        "steps": [
          {
            "index": 0,
            "name": "Activate SystmOne",
            "action": "ACTIVATE",
            "outputKey": "activatedWindow",
            "inputValue": "SystmOne A&E",
            "timeoutMs": 10000,
            "locatorChain": [
              {
                "type": "JAB",
                "role": "menu",
                "name": "Patient",
                "nameMatch": "CONTAINS"
              }
            ]
          },
          {
            "index": 1,
            "name": "Click attendance",
            "action": "CLICK",
            "timeoutMs": 8000,
            "locatorChain": [
              {
                "type": "JAB",
                "role": "push button",
                "name": "Attendance",
                "nameMatch": "EXACT"
              }
            ]
          },
          {
            "index": 2,
            "name": "Enter NHS number",
            "action": "SET_TEXT",
            "locatorChain": [
              {
                "type": "IMAGE",
                "anchorTemplateRef": "patient-registration-search",
                "templateRef": null,
                "threshold": 0.9,
                "offsetX": 105,
                "offsetY": 13
              }
            ],
            "inputValue": "${nhsNumber}",
            "timeoutMs": 8000
          },
          {
            "index": 3,
            "name": "Click Search",
            "action": "KEYS",
            "inputValue": "ALT+e",
            "locatorChain": [
              {
                "type": "IMAGE",
                "templateRef": "patient-registration-search-button",
                "threshold": 0.4
              }
            ],
            "timeoutMs": 8000
          },
          {
            "index": 4,
            "name": "Click Select",
            "action": "KEYS",
            "inputValue": "ALT+s",
            "locatorChain": [
              {
                "type": "IMAGE",
                "templateRef": "1-patient-found",
                "threshold": 0.9
              }
            ],
            "timeoutMs": 8000
          },
          {
            "index": 5,
            "name": "Dismiss information popup",
            "action": "KEYS",
            "inputValue": "ALT+o",
            "locatorChain": [
              {
                "type": "IMAGE",
                "anchorTemplateRef": "information-popup",
                "templateRef": null,
                "threshold": 0.9,
                "offsetX": 248,
                "offsetY": 117
              }
            ],
            "timeoutMs": 4000,
            "continueOnFailure": true
          },
          {
            "index": 6,
            "name": "Mode of arrival",
            "action": "SET_TEXT",
            "inputValue": "Walked in",
            "locatorChain": [
              {
                "type": "IMAGE",
                "anchorTemplateRef": "mode-of-arrival",
                "templateRef": null,
                "threshold": 0.9,
                "offsetX": 136,
                "offsetY": 10
              }
            ],
            "timeoutMs": 8000
          },
          {
            "index": 7,
            "name": "Referral source",
            "action": "SET_TEXT",
            "inputValue": "Police",
            "locatorChain": [
              {
                "type": "IMAGE",
                "anchorTemplateRef": "referral-source",
                "templateRef": null,
                "threshold": 0.9,
                "offsetX": 156,
                "offsetY": 10
              }
            ],
            "timeoutMs": 8000
          },
          {
            "index": 8,
            "name": "Triage category",
            "action": "KEYS",
            "inputValue": "DOWN,DOWN,DOWN",
            "locatorChain": [
              {
                "type": "IMAGE",
                "anchorTemplateRef": "triage-category",
                "templateRef": null,
                "threshold": 0.9,
                "offsetX": 147,
                "offsetY": 8
              }
            ],
            "timeoutMs": 8000
          },
          {
            "index": 9,
            "name": "Triage now",
            "action": "CLICK",
            "locatorChain": [
              {
                "type": "IMAGE",
                "templateRef": "triage-now-button"
              }
            ],
            "timeoutMs": 8000
          },
          {
            "index": 10,
            "name": "Triage by me",
            "action": "CLICK",
            "locatorChain": [
              {
                "type": "IMAGE",
                "templateRef": "triage-me-button"
              }
            ],
            "timeoutMs": 8000
          },
          {
            "index": 11,
            "name": "Accompanied by",
            "action": "SET_TEXT",
            "inputValue": "Carer",
            "locatorChain": [
              {
                "type": "IMAGE",
                "anchorTemplateRef": "accompanied-by",
                "templateRef": null,
                "threshold": 0.9,
                "offsetX": 230,
                "offsetY": 10
              }
            ],
            "timeoutMs": 8000
          }
        ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
