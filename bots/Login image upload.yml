info:
  name: Login image upload
  type: http
  seq: 2

http:
  method: POST
  url: http://localhost:8080/api/templates
  headers:
    - name: X-Worker-Token
      value: changeit
  body:
    type: json
    data: |-
      {
        "name": "login",
        "s1Version": "DEMO",
        "threshold": 0.9,
        "dataBase64": "{{login-fields-b64}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        const fs = require('fs');
        const path = require('path');

        const filePath = path.join(bru.cwd(), 'login', 'login-fields.png');
        const fileBuffer = fs.readFileSync(filePath);
        const base64Content = fileBuffer.toString('base64');

        bru.setVar('login-fields-b64', base64Content);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
