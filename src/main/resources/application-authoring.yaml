# Authoring profile: the capture tool. A web app on its own port that pulls screenshots from
# workers over RabbitMQ and reads/writes the registry through the control plane's REST API.
# It owns no database of its own, and never writes a screenshot to disk (§5.4).
server:
  port: ${AUTHORING_PORT:8081}

spring:
  autoconfigure:
    # Spring Boot 4 moved these out of spring-boot-autoconfigure into their own modules and
    # renamed the repositories one. The 3.x names silently excluded nothing — the class is not
    # on the classpath, so Boot has no way to tell a stale name from a typo — and this role
    # quietly started a datasource it has no use for. It only became visible when the default
    # datasource stopped being in-memory H2.
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration
      - org.springframework.boot.data.jpa.autoconfigure.DataJpaRepositoriesAutoConfiguration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  thymeleaf:
    cache: false

systmone:
  authoring:
    control-plane-url: ${CONTROL_PLANE_URL:http://localhost:8080}
    token: ${SYSTMONE_WORKER_TOKEN:changeit}
    capture-timeout-ms: ${AUTHORING_CAPTURE_TIMEOUT_MS:45000}
    max-captures: ${AUTHORING_MAX_CAPTURES:6}
    default-threshold: ${AUTHORING_DEFAULT_THRESHOLD:0.90}
    s1-version: ${S1_VERSION:DEMO}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      role: authoring
