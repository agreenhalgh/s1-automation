# Worker profile: consumes jobs from RabbitMQ and POSTs results to the control plane.
# A worker needs no database and no web server of its own.
spring:
  main:
    web-application-type: none
    # Spring Boot sets java.awt.headless=true by default, which disables Robot outright — and
    # with it every IMAGE locator, failure screenshot and authoring capture. A worker's whole
    # job needs the desktop, so it opts out here rather than relying on a JVM flag being
    # remembered. On a host with no display, Robot still degrades gracefully (see RobotInput).
    headless: false
  autoconfigure:
    # Spring Boot 4 moved these out of spring-boot-autoconfigure into their own modules and
    # renamed the repositories one. The 3.x names silently excluded nothing — the class is not
    # on the classpath, so Boot has no way to tell a stale name from a typo — and this role
    # quietly started a datasource it has no use for. It only became visible when the default
    # datasource stopped being in-memory H2.
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration
      - org.springframework.boot.data.jpa.autoconfigure.DataJpaRepositoriesAutoConfiguration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

systmone:
  worker:
    control-plane-url: ${CONTROL_PLANE_URL:http://localhost:8080}
    token: ${SYSTMONE_WORKER_TOKEN:changeit}
    worker-id: ${WORKER_ID:}
    capability-tag: ${WORKER_CAPABILITY:}
    window-title: ${S1_WINDOW_TITLE:SystmOne A&E}
    s1-version: ${S1_VERSION:DEMO}
    screenshot-dir: ${WORKER_SCREENSHOT_DIR:./worker-screenshots}
