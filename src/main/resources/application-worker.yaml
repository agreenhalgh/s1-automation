# Worker profile: consumes jobs from RabbitMQ and POSTs results to the control plane.
# A worker needs no database and no web server of its own.
spring:
  main:
    web-application-type: none
    # Spring Boot sets java.awt.headless=true by default, which disables Robot outright — and
    # with it every IMAGE locator, failure screenshot and authoring capture. A worker's whole
    # job needs the desktop, so it opts out here rather than relying on a JVM flag being
    # remembered. On a host with no display, Robot still degrades gracefully (see RobotInput).
    headless: false
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

systmone:
  worker:
    control-plane-url: ${CONTROL_PLANE_URL:http://localhost:8080}
    token: ${SYSTMONE_WORKER_TOKEN:changeit}
    worker-id: ${WORKER_ID:}
    capability-tag: ${WORKER_CAPABILITY:}
    window-title: ${S1_WINDOW_TITLE:SystmOne}
    s1-version: ${S1_VERSION:unknown}
    screenshot-dir: ${WORKER_SCREENSHOT_DIR:./worker-screenshots}
