spring:
  application:
    name: systmone
  profiles:
    # Default role is the control plane. Start a worker with --spring.profiles.active=worker
    active: controlplane

  # Control-plane persistence: PostgreSQL (NFR-CMP-03), served locally by the postgres
  # service in docker-compose.yaml, whose defaults these match. Only the controlplane
  # profile touches it — worker and authoring exclude the datasource entirely.
  #
  # `docker compose up -d` is therefore a prerequisite for starting the control plane. To
  # run without it, point JDBC_URL at in-memory H2, which is still on the runtime classpath:
  #   JDBC_URL='jdbc:h2:mem:systmone;DB_CLOSE_DELAY=-1' JDBC_USER=sa JDBC_PASSWORD=
  datasource:
    url: ${JDBC_URL:jdbc:postgresql://localhost:5432/systmone}
    username: ${JDBC_USER:systmone}
    password: ${JDBC_PASSWORD:systmone}
  jpa:
    hibernate:
      # Hibernate owns the schema for now; a real migration tool is listed as production
      # hardening in docs/IMPLEMENTATION.md. On Postgres this creates the tables on first
      # boot and adds columns after that, but it never drops or narrows one.
      ddl-auto: update
    open-in-view: false

  # RabbitMQ broker shared by control plane (publisher) and workers (consumers).
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

  thymeleaf:
    cache: false

  jackson:
    deserialization:
      # Jackson 3 rejects an explicit JSON null for a primitive; Jackson 2 coerced it to
      # 0/false. The definition records (BotDefinition, StepDefinition, RetryPolicyDef)
      # normalise absent scalars in their compact constructors, so a bot JSON that spells
      # out "continueOnFailure": null or "timeoutMs": null must land on the default rather
      # than fail the whole submission.
      fail-on-null-for-primitives: false

# Shared secret workers present when POSTing results (FR-WRK-07). Override in every real
# environment.
systmone:
  worker-token: ${SYSTMONE_WORKER_TOKEN:changeit}
  # Credentials Prometheus presents to scrape /actuator/prometheus, on every role. The
  # defaults match docker/prometheus/prometheus.yml so a developer stack works unconfigured;
  # set both in every real environment and give Prometheus the same values via password_file.
  metrics:
    username: ${METRICS_USER:prometheus}
    password: ${METRICS_PASSWORD:prometheus}

management:
  endpoints:
    web:
      exposure:
        # prometheus is the scrape endpoint the Prometheus container reads (NFR-OBS-03). It
        # is the one actuator endpoint reachable without an operator session, so it has its
        # own perimeter and its own credentials — config/MetricsSecurityConfig.
        include: health,info,metrics,prometheus
  metrics:
    tags:
      # Stamped on every series this process publishes, so one Prometheus can hold the
      # control plane, the capture tool and a dozen workers without their JVM and HTTP
      # metrics blurring into one. The profile yamls override `role`.
      application: ${spring.application.name}
      role: controlplane
    distribution:
      # Buckets, not just a count and a mean: "how long does a run take" is a question about
      # the tail, and an average hides the run that sat for four minutes waiting on a locator.
      percentiles-histogram:
        http.server.requests: true
        systmone.run.duration: true
        systmone.step.duration: true

logging:
  level:
    com.newbrid.epr_automation: INFO
